plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'br.com.oceanolivre.kraken'
    compileSdk 34

    defaultConfig {
        applicationId "br.com.oceanolivre.kraken"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

chaquopy {
    defaultConfig {
        version = "3.12"
        buildPython("C:/Users/Usuario/AppData/Local/Programs/Python/Python312/python.exe")
        pip {
            install "flask"
            install "flask-socketio"
            install "simple-websocket"
            install "qrcode"
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
