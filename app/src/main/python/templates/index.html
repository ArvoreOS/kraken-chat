<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kraken</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/icons/kraken.png">
<link rel="apple-touch-icon" href="/static/icons/kraken.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="app-banner" class="app-banner hidden">
  <span class="app-banner-text">📲 Você está usando pelo navegador. Quer instalar o app?</span>
  <div class="app-banner-actions">
    <a id="app-banner-download" class="app-banner-btn" href="#" target="_blank" rel="noopener">Baixar</a>
    <button type="button" id="app-banner-dismiss" class="app-banner-dismiss" title="Continuar no navegador">✕</button>
  </div>
</div>

<div id="name-screen" class="screen login-screen">
  <div class="login-hero">
    <img src="/static/icons/kraken-hero.jpg" alt="Kraken">
    <div class="login-fade"></div>
  </div>
  <div class="login-content">
    <h1>🐙 <span class="login-roxo">Kraken</span></h1>
    <p class="login-tagline" id="login-tagline">Entre com sua conta pra continuar</p>

    <form id="login-form" class="login-form">
      <input type="email" id="login-email" placeholder="E-mail" autocomplete="email" required>
      <input type="password" id="login-password" placeholder="Senha" autocomplete="current-password" required>
      <input type="text" id="login-name" maxlength="24" placeholder="Como quer ser chamado?" class="hidden">
      <p class="login-error hidden" id="login-error"></p>
      <button type="submit" id="login-submit" class="login-btn">Entrar</button>
    </form>

    <button type="button" id="login-toggle-mode" class="login-toggle">Não tem conta? Criar agora</button>
  </div>
</div>

<div id="chat-screen" class="screen hidden">
  <header class="topbar">
    <div class="brand">
      <img src="/static/icons/kraken.png" width="30" height="30" alt="Kraken">
      <span class="brand-text"><b class="roxo">Kraken</b></span>
      <button type="button" id="mode-toggle" class="mode-toggle on" title="Modo online/offline">
        <span class="plug">🔌</span><span id="mode-toggle-text">ON</span>
      </button>
      <button type="button" id="btn-avatar" class="avatar-btn" title="Perfil"></button>
    </div>
    <div class="status" id="status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">conectando…</span>
    </div>
    <div class="topbar-actions">
      <a href="/debug" class="btn amarelo small" title="Diagnóstico">🩺</a>
      <button type="button" id="btn-broadcast" class="btn vermelho small" title="Live" data-mode-only="on">🔴 Live</button>
      <button type="button" id="btn-call" class="btn roxo small" title="Chamada de vídeo" data-mode-only="on">🎥</button>
      <button type="button" id="btn-group-invite" class="btn amarelo small hidden" title="Convite deste grupo">🔗</button>
      <a href="/join" target="_blank" class="btn roxo small">+ Convidar</a>
    </div>
  </header>

  <nav id="tabs" class="tabs"></nav>

  <main id="messages"></main>

  <div id="record-bar" class="record-bar hidden">
    <button type="button" id="record-cancel" class="record-icon-btn" title="Cancelar">✕</button>
    <canvas id="record-wave" width="240" height="36"></canvas>
    <span id="record-timer">0:00</span>
    <button type="button" id="record-stop" class="record-icon-btn stop" title="Parar">⏹</button>
  </div>

  <div id="preview-bar" class="record-bar hidden">
    <button type="button" id="preview-cancel" class="record-icon-btn" title="Descartar">🗑️</button>
    <audio id="preview-audio" controls></audio>
    <button type="button" id="preview-send" class="record-icon-btn send" title="Enviar áudio">➤</button>
  </div>

  <form id="send-form" class="composer">
    <label class="attach-btn amarelo" for="file-input">📎</label>
    <input type="file" id="file-input" hidden>
    <button type="button" id="record-btn" class="attach-btn roxo" title="Gravar áudio">🎙️</button>
    <input type="file" id="audio-capture-input" accept="audio/*" capture hidden>
    <input type="text" id="text-input" placeholder="Escreva uma mensagem…" autocomplete="off">
    <button type="submit" class="btn verde send-btn">Enviar</button>
  </form>
</div>

<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal" id="modal-content"></div>
</div>

<div id="profile-screen" class="profile-screen hidden">
  <header class="profile-topbar">
    <button type="button" id="profile-back" class="icon-btn" title="Voltar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <span class="profile-topbar-title">Perfil</span>
  </header>

  <div class="profile-header">
    <div id="profile-avatar-big" class="avatar-big"></div>
    <div class="profile-name-row">
      <span id="profile-name" class="profile-name"></span>
      <span id="profile-mode-badge" class="profile-mode-badge on">
        <span class="dot"></span><span id="profile-mode-badge-text">ON</span>
      </span>
    </div>
    <div id="profile-stats" class="profile-stats"></div>
  </div>

  <div class="profile-tabs">
    <button type="button" class="profile-tab active" data-tab="galeria">Galeria</button>
    <button type="button" class="profile-tab" data-tab="sobre">Sobre</button>
  </div>

  <div id="profile-tab-galeria" class="profile-tab-panel">
    <div id="gallery-grid" class="gallery-grid"></div>
  </div>

  <div id="profile-tab-sobre" class="profile-tab-panel hidden">
    <div class="profile-about">
      <div class="profile-about-row"><span>Nome</span><b id="about-name"></b></div>
      <div class="profile-about-row"><span>Identificação do nó</span><b id="about-node-id" class="mono"></b></div>
    </div>
  </div>
</div>

<div id="media-viewer" class="media-viewer hidden">
  <button type="button" id="media-viewer-close" class="media-viewer-close">✕</button>
  <div id="media-viewer-content" class="media-viewer-content"></div>
</div>

<div id="call-screen" class="call-screen hidden">
  <video id="call-remote-video" class="call-remote-video" autoplay playsinline></video>
  <video id="call-local-video" class="call-local-video" autoplay playsinline muted></video>
  <div class="call-status" id="call-status-text"></div>
  <div class="call-controls">
    <button type="button" id="call-mute-btn" class="call-btn call-mute hidden" title="Mutar/desmutar microfone">🎤</button>
    <button type="button" id="call-accept-btn" class="call-btn call-accept hidden">✅ Atender</button>
    <button type="button" id="call-reject-btn" class="call-btn call-reject hidden">✕ Recusar</button>
    <button type="button" id="call-hangup-btn" class="call-btn call-hangup hidden">📵 Encerrar</button>
  </div>
</div>

<div id="live-screen" class="live-screen hidden">
  <video id="live-video" class="live-video" autoplay playsinline></video>
  <div class="live-status" id="live-status-text"></div>
  <div class="call-controls">
    <button type="button" id="live-stop-btn" class="call-btn call-hangup hidden">Encerrar</button>
  </div>
</div>

<script src="/static/mode.js"></script>
<script src="/static/socket.io.min.js"></script>
<script src="/static/janus.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
